<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="images/logo.png" type="image/png">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
  <script src="js/script.js" defer></script>
</head>

<body id="top">
  <header>
    <nav></nav>
  </header>

  <main>
    <section class="contact-page">
      <h1>Trete in Kontakt</h1>

      <div class="contact-layout">
        <div class="contact-form-column">
          <section class="contact-form-section">
            <h2>Kontaktformular</h2>

            <form class="contact-form">
              <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" required>
              </div>

              <div class="form-group">
                <label for="email">E-Mail *</label>
                <input type="email" id="email" name="email" required>
              </div>

              <div class="form-group">
                <label for="subject">Betreff</label>
                <input type="text" id="subject" name="subject">
              </div>

              <div class="form-group">
                <label for="message">Nachricht *</label>
                <textarea id="message" name="message" required></textarea>
              </div>

              <button type="submit" class="button-link primary">Nachricht senden</button>
            </form>
          </section>
        </div>

        <div class="contact-info-column">
          <section class="contact-info-section">
            <h2>Kontakt Information</h2>

            <article class="contact-info-card">
              <div class="contact-info-icon" aria-hidden="true">✉</div>
              <div class="contact-info-text">
                <h3>E-Mail</h3>
                <p><a href="mailto:jonathan@example.de">jonathan@example.de</a></p>
              </div>
            </article>

            <article class="contact-info-card">
              <div class="contact-info-icon" aria-hidden="true">☎</div>
              <div class="contact-info-text">
                <h3>Telefon</h3>
                <p>+49 000 0000000</p>
              </div>
            </article>

            <article class="contact-info-card">
              <div class="contact-info-icon" aria-hidden="true">⌂</div>
              <div class="contact-info-text">
                <h3>Standort</h3>
                <p>Deutschland</p>
              </div>
            </article>

            <div class="contact-map">
              <iframe
                src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d1134.2182529385918!2d9.985776325714568!3d53.54099860012424!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1selbphilharmonie!5e0!3m2!1sen!2sde!4v1774897979373!5m2!1sen!2sde"
                loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Standort auf Google Maps">
              </iframe>
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <footer></footer>
</body>

</html>
